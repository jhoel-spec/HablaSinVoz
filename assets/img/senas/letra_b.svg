<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f4f6f8" rx="8"/>
  <!-- Letra B: 4 dedos extendidos verticalmente juntos, pulgar flexionado sobre la palma -->
  <g stroke="#1b4467" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="#ffe0bd">
    <!-- Muñeca -->
    <path d="M70,165 L70,190 L130,190 L130,165 Z" fill="#e8c39e"/>
    <!-- Palma base -->
    <path d="M68,110 L68,155 C68,165 78,170 95,170 L115,170 C130,170 135,160 135,145 L135,110 Z"/>
    <!-- 4 Dedos extendidos verticales juntos -->
    <!-- Índice -->
    <path d="M68,110 L68,45 C68,35 82,35 82,45 L82,110 Z"/>
    <!-- Medio -->
    <path d="M82,110 L82,38 C82,28 97,28 97,38 L97,110 Z"/>
    <!-- Anular -->
    <path d="M97,110 L97,42 C97,32 112,32 112,42 L112,110 Z"/>
    <!-- Meñique -->
    <path d="M112,110 L112,55 C112,45 125,45 125,55 L125,110 Z"/>
    <!-- Pulgar doblado cruzando la palma -->
    <path d="M62,125 C55,135 65,150 85,148 C100,146 108,135 105,128 C102,122 88,125 75,125 Z" fill="#ffebd2"/>
  </g>
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b4467" text-anchor="middle">Seña en LSB</text>
</svg>
