<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f4f6f8" rx="8"/>
  <!-- Saludo: Mano abierta saludando con líneas de movimiento -->
  <g stroke="#1b4467" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="#ffe0bd">
    <path d="M75,160 L75,190 L125,190 L125,160 Z" fill="#e8c39e"/>
    <!-- Mano abierta -->
    <path d="M65,115 L65,155 C65,165 75,170 100,170 C125,170 135,165 135,155 L135,115 Z"/>
    <!-- Dedos abiertos -->
    <path d="M60,115 L50,65 C48,55 60,50 64,60 L72,115 Z"/>
    <path d="M72,115 L70,50 C70,40 82,40 84,50 L86,115 Z"/>
    <path d="M86,115 L90,45 C90,35 102,35 104,45 L106,115 Z"/>
    <path d="M106,115 L112,50 C112,40 124,40 126,50 L124,115 Z"/>
    <path d="M124,115 L140,75 C146,65 156,72 150,82 L135,125 Z"/>
    <!-- Líneas de movimiento de saludo -->
    <path d="M40,50 C35,65 35,80 40,95" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="4,4"/>
    <path d="M165,50 C170,65 170,80 165,95" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="4,4"/>
  </g>
  <text x="100" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1b4467" text-anchor="middle">¡Hola! (Saludo)</text>
</svg>
