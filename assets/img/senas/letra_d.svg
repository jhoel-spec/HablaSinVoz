<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f4f6f8" rx="8"/>
  <!-- Letra D: Índice vertical, los demás dedos forman un círculo con el pulgar -->
  <g stroke="#1b4467" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="#ffe0bd">
    <path d="M70,165 L70,190 L130,190 L130,165 Z" fill="#e8c39e"/>
    <!-- Círculo de pulgar y dedos medio/anular -->
    <ellipse cx="95" cy="130" rx="30" ry="25" fill="#ffe0bd"/>
    <!-- Dedo índice vertical -->
    <path d="M75,125 L75,45 C75,35 90,35 90,45 L90,125 Z" fill="#ffebd2"/>
  </g>
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1b4467" text-anchor="middle">Letra "D"</text>
</svg>
